---
name: "Pull Request: Validate"

"on":
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - "charts/**"
      - ".ci/**"
      - ".github/workflows/pr-validate.yml"
      - ".yamllint.yml"

concurrency:
  group: ${{ github.head_ref }}-pr-validate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate chart
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Python tools
        run: |
          python -m venv "${RUNNER_TEMP}/validate-venv"
          "${RUNNER_TEMP}/validate-venv/bin/pip" install yamllint yamale
          echo "${RUNNER_TEMP}/validate-venv/bin" >> "$GITHUB_PATH"

      - name: Lint YAML
        run: yamllint .

      - name: Validate charts
        run: |
          mkdir -p "${RUNNER_TEMP}/chart-package/other"
          for chart in charts/other/*/; do
            name="$(basename "$chart")"
            echo "::group::${name}"
            yamale -s .ci/ct/chart_schema.yaml "${chart}Chart.yaml"
            helm dependency build "$chart"
            helm lint "$chart"
            helm template "$name" "$chart" --namespace cardiac-dev
            # Every values file under examples/ is a render fixture: it must
            # produce valid manifests, not just parse.
            for values in "${chart}examples/"*.yaml; do
              [ -e "$values" ] || continue
              echo "-- rendering with $(basename "$values")"
              helm template "$name" "$chart" \
                --namespace cardiac-dev \
                --values "$values" \
                --api-versions gateway.networking.k8s.io/v1/HTTPRoute > /dev/null
            done
            helm package "$chart" \
              --dependency-update \
              --destination "${RUNNER_TEMP}/chart-package/other"
            echo "::endgroup::"
          done
          helm repo index "${RUNNER_TEMP}/chart-package" \
            --url https://uhn.github.io/helm-chart/
