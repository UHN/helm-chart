---
extends: default

ignore: |
  charts/**/templates/*.yaml

rules:
  # `brackets` covers [] only; flow mappings need `braces` configured to match,
  # otherwise the { key: value } style already used across charts/ is an error.
  braces:
    max-spaces-inside: 1
    min-spaces-inside: 0
  brackets:
    max-spaces-inside: 1
    min-spaces-inside: 0
  comments:
    require-starting-space: true
    min-spaces-from-content: 1
  indentation:
    spaces: consistent
    indent-sequences: consistent
    check-multi-line-strings: false
  line-length: disable
  quoted-strings:
    quote-type: any
    required: false
