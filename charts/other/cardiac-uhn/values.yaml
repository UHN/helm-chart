---
# yaml-language-server: $schema=values.schema.json
#
# cardiac-uhn — UHN Cardiac app chart (bjw-s app-template base).
#
# Secret model: External Secrets Operator + Stakater Reloader (cluster-native).
# Exposure: Gateway API HTTPRoute. See README for the consumer contract.
#
# Set global.nameOverride (or fullnameOverride) to your app name so resources
# and the ESO Secret are named after the app, not "cardiac-uhn".

global:
  nameOverride: ""
  fullnameOverride: ""
  createDefaultServiceAccount: false

defaultPodOptions:
  automountServiceAccountToken: true
  enableServiceLinks: false
  imagePullSecrets:
    - name: github-uhn-registry

controllers:
  main:
    type: deployment
    replicas: 1
    annotations:
      # Targeted reload: roll only when THIS app's ESO Secret rotates.
      secret.reloader.stakater.com/reload: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-secret'
    containers:
      main:
        image:
          repository: ghcr.io/uhn/cardiac-uhn
          tag: "0.1.0"
          pullPolicy: IfNotPresent
        # Non-secret config -> env. Secret-derived env comes from envFrom below.
        env:
          MY_POD_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          MY_POD_NAMESPACE:
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        # Materialized by the ExternalSecret (target name = <fullname>-secret).
        # optional: true so a secret-less app (externalSecret.enabled: false)
        # still starts instead of blocking on a missing Secret.
        envFrom:
          - secretRef:
              name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-secret'
              optional: true
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 3000
        targetPort: 3000

# Gateway API HTTPRoute. Points at the shared Envoy gateway in the network
# namespace (cohort convention). Disable for internal-only workloads.
route:
  main:
    enabled: false
    kind: HTTPRoute
    hostnames: []
    #  - app.stage.cardiac.uhn.ca
    parentRefs:
      - name: envoy
        namespace: network
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - identifier: main
            port: 3000

# External Secrets Operator. `data` = discrete property fetches; `template` =
# composed secrets / rendered files. See templates/externalsecret.yaml.
externalSecret:
  enabled: true
  refreshInterval: 1h
  creationPolicy: Owner
  secretStore:
    # namespace-helm-chart provisions "cardiac-secret" (kind SecretStore) in
    # every cardiac namespace. NOTE: cardiac-stage/apps/cohort currently
    # references "vault-secrets" — confirm and reconcile before cutover.
    kind: SecretStore
    name: cardiac-secret
  # spec.data — one entry per secret key (ESO passthrough).
  data: []
  #  - secretKey: COHORT_CLIENT_SECRET
  #    remoteRef:
  #      key: cardiac/overlays/stage/app/cohort
  #      property: client_secret
  # spec.dataFrom — bulk extract of an entire Vault key (ESO passthrough).
  dataFrom: []
  # spec.target.template — compose values / render whole files. Replaces the
  # consul-template MONGO_URL composition and `files:` config rendering.
  template: {}
  #   engineVersion: v2
  #   data:
  #     MONGO_URL: "mongodb://{{ .mUser }}:{{ .mPass }}@{{ .mUrl }}"
  #     config.json: |
  #       { "clientId": "{{ .epicClientId }}" }
