---
# The push-to-deploy shape from values.pvc-eso.yaml, with the site put behind
# OIDC at the gateway and restricted to one realm group. Exercises every branch
# of templates/securitypolicy.yaml: the SecurityPolicy, the JWT group check,
# and the unauthenticated /__deploy carve-out for the receiver. Two hostnames
# on purpose -- the OIDC redirect is per-request, so both must work.
#
#   helm template mysite charts/other/uhn-website \
#     --namespace cardiac-stage -f examples/values.oidc-groups.yaml

global:
  nameOverride: mysite
  fullnameOverride: mysite

controllers:
  main:
    containers:
      receiver:
        enabled: true

route:
  main:
    enabled: true
    hostnames:
      - mysite.stage.cardiac.uhn.ca
      - mysite-alias.stage.cardiac.uhn.ca

auth:
  enabled: true
  issuer: https://oa.uhnresearch.ca/auth/realms/CVDMC
  jwksURI: https://oa.uhnresearch.ca/auth/realms/CVDMC/protocol/openid-connect/certs
  clientID: mysite
  # Must exist in the realm and be mapped onto the access token: the policy is
  # deny-by-default, so an absent or misspelled group denies everyone.
  groups: [cardiac-mysite]

# One ExternalSecret carries the receiver's basic-auth credential and the OIDC
# client secret. The key name `client-secret` is Envoy Gateway's, not ours.
externalSecret:
  enabled: true
  secretStore:
    name: cardiac-secret
  data:
    - secretKey: user
      remoteRef: { key: &vk cardiac/overlays/stage/app/mysite, property: deploy_user }
    - secretKey: pass
      remoteRef: { key: *vk, property: deploy_pass }
    - secretKey: client-secret
      remoteRef: { key: *vk, property: client_secret }
