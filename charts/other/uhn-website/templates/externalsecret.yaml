{{- if .Values.externalSecret.enabled -}}
{{- $es := .Values.externalSecret -}}
{{- $fullname := include "bjw-s.common.lib.chart.names.fullname" . -}}
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# External Secrets Operator pulls from the namespace SecretStore that
# namespace-helm-chart provisions (default "cardiac-secret", Vault KV2 mount
# "cardiac-secret", keys "cardiac/overlays/<tier>/...").
#
# For this chart the Secret carries the /__deploy basic-auth credential: the
# receiver reads exactly the keys `user` and `pass`. The resulting Secret is
# named <fullname>-secret, which site.deployAuthSecret points at by default.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ $es.secretStore.kind | default "SecretStore" }}
    name: {{ required "externalSecret.secretStore.name is required" $es.secretStore.name }}
  target:
    name: {{ $fullname }}-secret
    creationPolicy: {{ $es.creationPolicy | default "Owner" }}
    {{- with $es.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $es.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
