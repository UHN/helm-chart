apiVersion: v1
entries:
  cardiac-uhn:
  - annotations:
      app-template.uhn.io/reference-app: repos/cardiac-stage-argo.uhn.io/apps/cohort
      app-template.uhn.io/source: external-example/helm-charts/charts/other/app-template
      artifacthub.io/changes: |-
        - kind: changed
          description: >-
            Pivot to the cluster-native secret model. Replace the consul-template /
            vault-agent in-pod rendering with External Secrets Operator
            (ExternalSecret -> Secret -> envFrom) and Stakater Reloader.
        - kind: changed
          description: Expose apps via Gateway API HTTPRoute (route:) instead of Ingress.
        - kind: removed
          description: >-
            Remove vault-agent/consul-template init containers, the vault-config
            ConfigMap, and the nats/mongo/files consul-template helpers.
        - kind: fixed
          description: >-
            Drop the pinned global.nameOverride default so resource names derive
            from the release/override instead of always being "cardiac-uhn".
