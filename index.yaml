  uhn-website:
  - annotations:
      artifacthub.io/changes: |-
        - kind: added
          description: >-
            Optional OIDC in front of the site, enforced by the gateway rather than
            by nginx or a sidecar. Renders an Envoy Gateway SecurityPolicy attached
            to the main HTTPRoute: Envoy runs the authorization-code flow, sets an
            encrypted session cookie, and only then forwards to nginx. The redirect
            URL is per-request, so routes with several hostnames work. The pod is
            unchanged.
        - kind: added
          description: >-
            Optional group restriction on that OIDC session -- the same model as
            cohort's COHORT_GROUP, expressed as policy. Setting auth.groups
            additionally validates the access token as a JWT against auth.jwksURI
            and denies any request whose group claim does not match.
        - kind: added
          description: >-
            With auth and the receiver both enabled, a second HTTPRoute matching
            `Exact: /__deploy` is emitted with no policy attached, so CI keeps
            pushing with the receiver's basic-auth credential. An exact match
            outranks the main route's PathPrefix "/".
      uhn-website.uhn.io/pattern-source: gitlab.com/uhn/infrastructure/k8s -- helm-transplant-dash/charts/transplant-dash
      uhn-website.uhn.io/receiver-image: ghcr.io/uhn/website
      uhn-website.uhn.io/receiver-source: https://github.com/jduhamel/HTDashboard
        -- tools/receiver
